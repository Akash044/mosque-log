org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Kotlin incremental compilation — required because the project is on E: but Pub cache is on C:,
# and Kotlin's incremental compiler cannot relativize paths across drive roots on Windows.
kotlin.incremental=false
